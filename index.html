<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3n Shortener | Hub de Infraestrutura</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <style>
        :root {
            --bg: #0d0d10;
            --card: #16161f;
            --primary: #5865F2; /* Cor Principal 3n */
            --secondary: #00c853; /* Status Online */
            --github: #24292e;
            --text: #ffffff;
            --gray: #888;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .logo-main { width: 110px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(88, 101, 242, 0.4)); }
        
        h1 { font-size: 2.5rem; margin: 0; letter-spacing: -1px; }
        h1 span { color: var(--primary); }
        .tagline { color: var(--gray); margin-bottom: 35px; font-size: 1.1rem; }

        .grid-links {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .btn {
            padding: 16px;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
            background: var(--card);
        }

        .btn-discord { border-left: 4px solid var(--primary); }
        .btn-painel { border-left: 4px solid var(--secondary); }
        .btn-github { border-left: 4px solid #fff; }

        .btn:hover { 
            transform: translateY(-3px); 
            background: #1f1f2e;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Redirecionamento dc.gg */
        #redirect-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader {
            border: 3px solid #222;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 45px; height: 45px;
            animation: spin 0.8s linear infinite;
            margin: 25px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        #timer { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

    <div id="home-screen" class="hero">
        <img src="assets/img/logo.png" alt="3n Logo" class="logo-main">
        <h1>3n <span>Shortener</span></h1>
        <p class="tagline">Infraestrutura e Desenvolvimento.</p>

        <div class="grid-links">
            <a href="https://discord.gg/SEU_NOVO_DISCORD" target="_blank" class="btn btn-discord">
                <span>🌐</span> Comunidade 3n
            </a>
            <a href="https://painel.3nhost.com" target="_blank" class="btn btn-painel">
                <span>⚡</span> Painel 3n Host
            </a>
            <a href="https://github.com/3nz00dc" target="_blank" class="btn btn-github">
                <span>📁</span> Projetos GitHub
            </a>
        </div>
    </div>

    <div id="redirect-screen">
        <img src="assets/img/logo.png" width="70">
        <h2>Redirecionando...</h2>
        <div class="loader"></div>
        <p>Aguarde <span id="timer">5</span>s</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const codigo = urlParams.get('c');

        const destinos = {
            "dc": "https://dc.gg/3nhost",
            "painel": "https://painel.3nhost.com",
            "git": "https://github.com/3nz00dc"
        };

        if (codigo && destinos[codigo]) {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('redirect-screen').style.display = 'flex';

            let countdown = 5;
            const timer = document.getElementById('timer');

            const interval = setInterval(() => {
                countdown--;
                timer.innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                    window.location.href = destinos[codigo];
                }
            }, 1000);
        }
    </script>
</body>
</html>
